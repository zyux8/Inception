services:

  mariadb:
    build: ./requirements/mariadb
    image: "mariadb:inception"
    # ports:
      # - "3306:3306"
    networks:
      - inception
    volumes:
      - db-volume:/var/lib/mysql
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    restart: always
  nginx:
    build: ./requirements/nginx
    image: "nginx:inception"
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wp-volume:/var/www/html
    restart: always

  wordpress:
    build: ./requirements/wordpress
    image: "wordpress:inception"
    container_name: wordpress
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wp-volume:/var/www/html
    env_file: .env
    secrets:
      - credentials
      - db_password
    restart: always

volumes:
  wp-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wordpress

  db-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
    inception:
        driver: bridge

secrets:
  credentials:
    file: ../secrets/credentials.txt
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
